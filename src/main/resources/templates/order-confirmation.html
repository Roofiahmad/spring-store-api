<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; border-radius: 10px 10px 0 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        .total { font-size: 18px; font-weight: bold; text-align: right; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Order Confirmation</h1>
    </div>
    <p>Hi <span th:text="${customerName}">Customer</span>,</p>
    <p>Thank you for your order! Here are your order details (<strong>#<span th:text="${orderNumber}">000</span></strong>):</p>

    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}">Item Name</td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${item.price}">$0.00</td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        Total: $<span th:text="${totalAmount}">0.00</span>
    </div>

    <p>We'll notify you when your items are on the way!</p>
    <p>Best regards,<br/>Roofiahmad Homelabs</p>
</div>
</body>
</html>
