<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout Canceled</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">
<div class="bg-white p-10 rounded-xl shadow-md max-w-lg w-full text-center border-t-4 border-yellow-400">
    <div class="flex justify-center mb-6">
        <div class="rounded-full bg-yellow-50 p-4">
            <svg class="w-12 h-12 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-3">Order Not Completed</h1>
    <p class="text-gray-600 mb-8 leading-relaxed">
        It looks like your payment was canceled or interrupted. Don't worry you haven't been charged.
    </p>

    <div class="space-y-4">
        <div class="flex items-center py-2">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="px-3 text-sm text-gray-400 italic">Need help?</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <p class="text-sm text-gray-500">
            If you're having trouble with your payment method, please contact us at
            <a th:href="'mailto:' + ${supportEmail}" class="text-blue-600 hover:underline font-medium" th:text="${supportEmail}">support@example.com</a>
        </p>
    </div>
</div>
</body>
</html>
