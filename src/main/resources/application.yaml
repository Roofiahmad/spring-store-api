server:
  port: ${PORT:8000}

spring:
  application:
    name: spring-store-app
  jpa:
    properties:
      hibernate:
        generate_statistics: true
  jwt:
    secret: ${APP_JWT_SECRET_KEY:dummy_jwt_secret_key}
    accessTokenExpiration: 3600
    refreshTokenExpiration: 604800
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 30
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        rewriteBatchedStatements: true
      leak-detection-threshold: 5000
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name:store-ws}
    distribution:
      percentiles-histograms:
        http.server.requests: true

stripe:
  secretKey: ${STRIPE_SECRET_KEY:dummy_stripe_secret_key}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY:dummy_webhook_secret_key}

minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET_NAME}

order:
  valueAddedTax: 0.11
  shippingFee: 45000