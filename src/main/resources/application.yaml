server:
  port: ${PORT:8000}
spring:
  application:
    name: spring-store-app
  jwt:
    secret: ${APP_JWT_SECRET_KEY:dummy_jwt_secret_key}
    accessTokenExpiration: 7200
    refreshTokenExpiration: 604800
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
stripe:
  secretKey: ${STRIPE_SECRET_KEY:dummy_stripe_secret_key}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY:dummy_webhook_secret_key}
minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET_NAME}

